<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Settings.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Settings</h1>
            <div class="stats">
                <div class="coins">
                    <img src="../Прочее/Монета.png" alt="Монеты">
                    <span id="coin-count">100</span>
                </div>
                <div class="streak">
                    <img src="../Прочее/Огонь.png" alt="Серия дней">
                    <span id="streak-count">7</span>
                </div>
            </div>
        </header>

        <main>
            <section class="theme-settings">
                <h2>Настройки темы</h2>
                
                <div class="setting-group">
                    <h3>Выберите тему</h3>
                    <div class="theme-options">
                        <div class="theme-option" data-theme="light">
                            <div class="theme-preview light-theme"></div>
                            <span>Светлая</span>
                        </div>
                        <div class="theme-option" data-theme="dark">
                            <div class="theme-preview dark-theme"></div>
                            <span>Тёмная</span>
                        </div>
                        <div class="theme-option" data-theme="custom">
                            <div class="theme-preview custom-theme"></div>
                            <span>Своя</span>
                        </div>
                    </div>
                </div>
                
                <div class="setting-group custom-color-settings">
                    <h3>Настройка своей темы</h3>
                    <div class="color-picker">
                        <label for="background-color">Цвет фона:</label>
                        <input type="color" id="background-color" value="#f5f5f5">
                    </div>
                    <div class="color-picker">
                        <label for="text-color">Цвет текста:</label>
                        <input type="color" id="text-color" value="#333333">
                    </div>
                    <div class="color-picker">
                        <label for="accent-color">Акцентный цвет:</label>
                        <input type="color" id="accent-color" value="#4285f4">
                    </div>
                    <button id="apply-custom-theme">Применить</button>
                </div>
            </section>
            
            <section class="app-settings">
                <h2>Настройки приложения</h2>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <span>Уведомления</span>
                        <p class="setting-description">Получать уведомления о задачах</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="notifications-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <span>Звуки</span>
                        <p class="setting-description">Включить звуки при выполнении задач</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="sounds-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <span>Сбросить прогресс</span>
                        <p class="setting-description">Сбросить все задачи и настройки</p>
                    </div>
                    <button id="reset-button" class="danger-button">Сбросить</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="../Daily/Daily.html">
                <i class="fas fa-calendar-day"></i>
                <span>Daily</span>
            </a>
            <a href="../Weekly/Weekly.html">
                <i class="fas fa-calendar-week"></i>
                <span>Weekly</span>
            </a>
            <a href="../Actions/Actions.html">
                <i class="fas fa-bolt"></i>
                <span>Actions</span>
            </a>
            <a href="../Settings/Settings.html" class="active">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="Settings.js"></script>
</body>
</html>

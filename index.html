<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё приложение</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="coin-counter">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C7.5 2 4 5.5 4 10c0 4 3.5 6 4 8 .5 2 .5 4 4 4s3.5-2 4-4c.5-2 4-4 4-8 0-4.5-3.5-8-8-8z"/>
            <path d="M12 2c0 4.5 3.5 8 8 8-4.5 0-8 3.5-8 8"/>
            <path d="M12 2C12 6.5 8.5 10 4 10c4.5 0 8 3.5 8 8"/>
        </svg>
        <span>1000</span>
    </div>
    <div class="streak-counter">
        <img src="image.png" alt="Streak counter" class="streak-icon">
        <span>7</span>
    </div>
    <div class="next-task">
        <p class="task-label">Следующее задание:</p>
        <div class="task-card">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Сделать 50 приседаний</span>
                </div>
                <div class="task-duration">
                    <span class="task-time">12:30 - 13:00</span>
                    <span class="duration-badge">30 мин</span>
                </div>
            </div>
        </div>
    </div>
    <div class="daily-tasks">
        <p class="task-label">Задания на весь день:</p>
        <div class="task-card daily">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Выпить 2 литра воды</span>
                    <button class="complete-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="task-card daily">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Прочитать 20 страниц книги</span>
                    <button class="complete-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="task-card daily">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Сделать зарядку</span>
                    <button class="complete-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <main>
        <!-- Убрали <h1>1</h1> -->
    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="gallery.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
            </svg>
            <span>Галерея</span>
        </a>
        <a href="quests.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Квесты</span>
        </a>
        <a href="actions.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Действия</span>
        </a>
    </nav>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё приложение</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="coin-counter">
        <img src="image2.png" alt="Coin" class="coin-icon">
        <span>0,000</span>
    </div>
    <div class="streak-counter">
        <img src="image.png" alt="Streak counter" class="streak-icon">
        <span>0</span>
    </div>
    <div class="next-task">
        <p class="task-label">Следующее задание:</p>
        <div class="task-card">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Сделать 50 приседаний <span>(1/25)</span></span>
                </div>
                <div class="task-duration">
                    <span class="task-time">12:30 - 13:00</span>
                    <span class="duration-badge">30 мин</span>
                </div>
            </div>
        </div>
    </div>
    <div class="daily-tasks">
        <p class="task-label">Задания на весь день:</p>
        <div class="task-card daily">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Выпить 2 литра воды</span>
                    <button class="complete-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="task-card daily">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Прочитать 20 страниц книги</span>
                    <button class="complete-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="task-card daily">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">Сделать зарядку</span>
                    <button class="complete-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <main>
        <!-- Убрали <h1>1</h1> -->
    </main>
    <div class="theme-toggle">
        <button class="theme-btn">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 0v3M12 21v3M3.93 3.93l2.12 2.12M17.95 17.95l2.12 2.12M0 12h3M21 12h3M3.93 20.07l2.12-2.12M17.95 6.05l2.12-2.12"/>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="quests.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Квесты</span>
        </a>
        <a href="actions.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Действия</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Настройки</span>
        </a>
    </nav>
    <script src="script.js"></script>
</body>
</html>

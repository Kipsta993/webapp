<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Действия</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <!-- Счетчики -->
        <div class="coin-counter">
            <img src="image2.png" alt="Coin" class="coin-icon">
            <span>0,000</span>
        </div>
        <div class="streak-counter">
            <img src="image.png" alt="Streak counter" class="streak-icon">
            <span>0</span>

        <!-- Блоки действий -->
        <div class="actions-container">
            <div class="action-block">
                <h3>1 Действие</h3>
                <p class="price">100 монет</p>
                <button class="buy-button">Купить</button>
            </div>
            <div class="action-block">
                <h3>3 Действия</h3>
                <p class="price">250 монет</p>
                <button class="buy-button">Купить</button>
            </div>
            <div class="action-block">
                <h3>5 Действий</h3>
                <p class="price">400 монет</p>
                <button class="buy-button">Купить</button>
            </div>
        </div>

        <!-- Ежедневный сундук -->
        <div class="daily-chest">
            <h2>Ежедневный сундук</h2>
            <img src="image4.png" alt="Ежедневный сундук" class="chest-image">
            <div class="timer">
                <span>До обновления: </span>
                <span class="time-left">12:30:45</span>
            </div>
        </div>
    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="actions.html" class="nav-item">
            <img src="image1.png" alt="Actions" class="nav-icon">
            <span>Действия</span>
        </a>
        <a href="settings.html" class="nav-item">
            <img src="image1.png" alt="Settings" class="nav-icon">
            <span>Настройки</span>
        </a>
    </nav>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Действия</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="coin-counter">
        <img src="image2.png" alt="Coin" class="coin-icon">
        <span>0,000</span>
    </div>
    <div class="streak-counter">
        <img src="image.png" alt="Streak counter" class="streak-icon">
        <span>0</span>
    </div>
    <div class="next-task">
        <p class="task-label">Действия:</p>
        <div class="task-card">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">1 Действие <span></span></span>
                </div>
            </div>
            <div class="price-tag">
                <div class="price-container">
                    <img src="image2.png" alt="Coin" class="coin-icon">
                    <span>100</span>
                </div>
            </div>
            <button class="buy-button">Купить</button>
        </div>

        <div class="task-card">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">3 Действия <span></span></span>
                </div>
            </div>
            <div class="price-tag">
                <div class="price-container">
                    <img src="image2.png" alt="Coin" class="coin-icon">
                    <span>250</span>
                </div>
            </div>
            <button class="buy-button">Купить</button>
        </div>

        <div class="task-card">
            <div class="task-info">
                <div class="task-header">
                    <span class="task-text">5 Действий <span></span></span>
                </div>
            </div>
            <div class="price-tag">
                <div class="price-container">
                    <img src="image2.png" alt="Coin" class="coin-icon">
                    <span>400</span>
                </div>
            </div>
            <button class="buy-button">Купить</button>
        </div>
    </div>

    <!-- Ежедневный сундук -->
    <div class="daily-chest">
        <h2>Ежедневный сундук</h2>
        <img src="image4.png" alt="Ежедневный сундук" class="chest-image">
        <div class="timer">
            <span>До обновления: </span>
            <span class="time-left">12:30:45</span>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="actions.html" class="nav-item active">
            <img src="image1.png" alt="Actions" class="nav-icon">
            <span>Действия</span>
        </a>
        <a href="settings.html" class="nav-item">
            <img src="image1.png" alt="Settings" class="nav-icon">
            <span>Настройки</span>
        </a>
    </nav>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квесты</title>
    <link rel="stylesheet" href="quests.css">
</head>
<body>
    <div class="quest-container">
        <div class="quest-card">
            <div class="quest-header">
                <span class="quest-title">Чтение книги</span>
                <span class="quest-time">2 часа</span>
            </div>
            <div class="quest-details">
                <span class="quest-reward">30 монет</span>
                <button class="take-quest-btn">Взять квест</button>
            </div>
        </div>
        <div class="quest-card">
            <div class="quest-header">
                <span class="quest-title">Утренняя зарядка</span>
                <span class="quest-time">1 час</span>
            </div>
            <div class="quest-details">
                <span class="quest-reward">50 монет</span>
                <button class="take-quest-btn">Взять квест</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

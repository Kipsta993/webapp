<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квесты</title>
    <link rel="stylesheet" href="quests.css">
</head>
<body>
    <div class="coin-counter">
        <img src="image2.png" alt="Coin" class="coin-icon">
        <span>0,000</span>
    </div>
    <div class="streak-counter">
        <img src="image.png" alt="Streak counter" class="streak-icon">
        <span>0</span>
    </div>
    <div class="quest-container">
        <div class="active-quest">
            <h2>Активный квест</h2>
            <div class="quest-card">
                <div class="quest-header">
                    <span class="quest-title">Нет активного квеста</span>
                </div>
            </div>
        </div>
        <div class="quest-card">
            <div class="quest-header">
                <span class="quest-title">Чтение книги</span>
                <span class="quest-time">2 часа</span>
            </div>
            <div class="quest-details">
                <div class="quest-reward">
                    <img src="image2.png" alt="Coin" class="reward-icon">
                    <span>30</span>
                </div>
                <span class="quest-time-badge">2 часа</span>
                <button class="take-quest-btn">Взять квест</button>
                <button class="details-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                        <circle cx="5" cy="12" r="1"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="quest-card">
            <div class="quest-header">
                <span class="quest-title">Утренняя зарядка</span>
                <span class="quest-time">1 час</span>
            </div>
            <div class="quest-details">
                <div class="quest-reward">
                    <img src="image2.png" alt="Coin" class="reward-icon">
                    <span>50</span>
                </div>
                <span class="quest-time-badge">1 час</span>
                <button class="take-quest-btn">Взять квест</button>
                <button class="details-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="19" cy="12" r="1"/>
                        <circle cx="5" cy="12" r="1"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="quests.html" class="nav-item">
            <img src="image1.png" alt="Quests" class="nav-icon">
            <span>Квесты</span>
        </a>
        <a href="actions.html" class="nav-item">
            <img src="image1.png" alt="Actions" class="nav-icon">
            <span>Действия</span>
        </a>
        <a href="settings.html" class="nav-item">
            <img src="image1.png" alt="Settings" class="nav-icon">
            <span>Настройки</span>
        </a>
    </nav>
    <script src="script.js"></script>
</body>
</html>

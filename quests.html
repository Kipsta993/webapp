<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квесты</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="quests.css">
</head>
<body>
    <div class="coin-counter">
        <img src="image2.png" alt="Coin" class="coin-icon">
        <span>0,000</span>
    </div>
    <div class="streak-counter">
        <img src="image.png" alt="Streak counter" class="streak-icon">
        <span>0</span>
    </div>
    <main>
        <div class="quest-container">
            <div class="active-quest">
                <h2>Активный квест</h2>
                <div class="quest-card active">
                    <!-- Сюда будет вставляться активный квест -->
                </div>
            </div>
            
            <div class="available-quests">
                <h2>Доступные квесты</h2>
                <div class="quest-grid">
                    <div class="quest-card">
                        <div class="quest-content">
                            <h3>Утренняя зарядка</h3>
                            <p>Сделай 20 отжиманий, 30 приседаний и 10 подтягиваний</p>
                            <div class="quest-details">
                                <span class="quest-reward-badge">+<span>50</span> монет</span>
                                <span class="quest-time-badge">1 час</span>
                            </div>
                            <button class="take-quest-btn">Взять квест</button>
                        </div>
                    </div>
                    
                    <div class="quest-card">
                        <div class="quest-content">
                            <h3>Чтение книги</h3>
                            <p>Прочитай 50 страниц любой книги</p>
                            <div class="quest-details">
                                <span class="quest-reward-badge">+<span>30</span> монет</span>
                                <span class="quest-time-badge">2 часа</span>
                            </div>
                            <button class="take-quest-btn">Взять квест</button>
                        </div>
                    </div>
                    
                    <div class="quest-card">
                        <div class="quest-content">
                            <h3>Прогулка</h3>
                            <p>Пройди 10,000 шагов</p>
                            <div class="quest-details">
                                <span class="quest-reward-badge">+<span>40</span> монет</span>
                                <span class="quest-time-badge">3 часа</span>
                            </div>
                            <button class="take-quest-btn">Взять квест</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="quests.html" class="nav-item active">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Квесты</span>
        </a>
        <a href="actions.html" class="nav-item">
            <img src="image1.png" alt="Home" class="nav-icon">
            <span>Действия</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Настройки</span>
        </a>
    </nav>
    <script src="script.js"></script>
</body>
</html>

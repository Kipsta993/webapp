<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Stats.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Statistics</h1>
            <div class="stats">
                <div class="streak">
                    <img src="../Прочее/Огонь.png" alt="Серия дней">
                    <span id="streak-count">7</span>
                </div>
            </div>
        </header>

        <main>
            <section class="usage-stats">
                <h2>Время использования</h2>
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="years-count">0</div>
                        <div class="stat-label">Лет</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="months-count">0</div>
                        <div class="stat-label">Месяцев</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="days-count">0</div>
                        <div class="stat-label">Дней</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="hours-count">0</div>
                        <div class="stat-label">Часов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="minutes-count">0</div>
                        <div class="stat-label">Минут</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="seconds-count">0</div>
                        <div class="stat-label">Секунд</div>
                    </div>
                </div>
            </section>

            <section class="streak-stats">
                <h2>Серия дней</h2>
                <div class="stat-row">
                    <div class="stat-label">Текущая серия:</div>
                    <div class="stat-value" id="current-streak">7</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Максимальная серия:</div>
                    <div class="stat-value" id="max-streak">7</div>
                </div>
            </section>

            <section class="tasks-stats">
                <h2>Выполненные задания</h2>
                <div class="stat-row">
                    <div class="stat-label">Ежедневные задания:</div>
                    <div class="stat-value" id="daily-tasks-completed">0</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Еженедельные задания:</div>
                    <div class="stat-value" id="weekly-tasks-completed">0</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Всего заданий:</div>
                    <div class="stat-value" id="total-tasks-completed">0</div>
                </div>
            </section>

            <section class="diary-stats">
                <h2>Дневник</h2>
                <div class="stat-row">
                    <div class="stat-label">Всего записей:</div>
                    <div class="stat-value" id="diary-entries-count">0</div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="../index.html">
                <i class="fas fa-calendar-day"></i>
                <span>Daily</span>
            </a>
            <a href="../Weekly/Weekly.html">
                <i class="fas fa-calendar-week"></i>
                <span>Weekly</span>
            </a>
            <a href="Stats.html" class="active">
                <i class="fas fa-chart-bar"></i>
                <span>Stats</span>
            </a>
            <a href="../Diary/Diary.html">
                <i class="fas fa-book"></i>
                <span>Diary</span>
            </a>
            <a href="../Settings/Settings.html">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="Stats.js"></script>
</body>
</html>

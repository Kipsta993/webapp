<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Diary.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Diary</h1>
            <div class="stats">
                <div class="coins">
                    <img src="../Прочее/Монета.png" alt="Монеты">
                    <span id="coin-count">100</span>
                </div>
                <div class="streak">
                    <img src="../Прочее/Огонь.png" alt="Серия дней">
                    <span id="streak-count">7</span>
                </div>
            </div>
        </header>

        <main>
            <!-- Список записей дневника -->
            <section class="diary-entries" id="entries-list">
                <div class="section-header">
                    <h2>Мои записи</h2>
                    <button id="add-entry-btn" class="add-btn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                
                <div class="entries-container" id="entries-container">
                    <!-- Записи будут добавляться динамически через JavaScript -->
                </div>
            </section>

            <!-- Форма для создания/редактирования записи -->
            <section class="entry-form" id="entry-form">
                <div class="section-header">
                    <h2 id="form-title">Новая запись</h2>
                    <button id="close-form-btn" class="close-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <form id="diary-form">
                    <div class="form-group">
                        <label for="entry-title">Заголовок</label>
                        <input type="text" id="entry-title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="entry-content">Содержание</label>
                        <textarea id="entry-content" rows="8" required></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" id="cancel-btn" class="cancel-btn">Отмена</button>
                        <button type="submit" id="save-btn" class="save-btn">Сохранить</button>
                    </div>
                    
                    <input type="hidden" id="entry-id" value="">
                </form>
            </section>

            <!-- Просмотр записи -->
            <section class="entry-view" id="entry-view">
                <div class="section-header">
                    <h2 id="view-title">Просмотр записи</h2>
                    <div class="view-actions">
                        <button id="edit-entry-btn" class="edit-btn">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button id="close-view-btn" class="close-btn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                
                <div class="entry-content" id="view-content">
                    <!-- Содержимое записи будет добавлено через JavaScript -->
                </div>
                
                <div class="entry-date" id="view-date">
                    <!-- Дата записи будет добавлена через JavaScript -->
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="../index.html">
                <i class="fas fa-calendar-day"></i>
                <span>Daily</span>
            </a>
            <a href="../Weekly/Weekly.html">
                <i class="fas fa-calendar-week"></i>
                <span>Weekly</span>
            </a>
            <a href="../Diary/Diary.html" class="active">
                <i class="fas fa-book"></i>
                <span>Diary</span>
            </a>
            <a href="../Actions/Actions.html">
                <i class="fas fa-bolt"></i>
                <span>Actions</span>
            </a>
            <a href="../Settings/Settings.html">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="Diary.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./Settings.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Settings</h1>
            <div class="stats">
                <div class="streak">
                    <img src="../Прочее/Огонь.png" alt="Серия дней">
                    <span id="streak-count">7</span>
                </div>
            </div>
        </header>

        <main>
            <section class="theme-settings">
                <h2>Настройки темы</h2>
                
                <div class="setting-group">
                    <h3>Выберите тему</h3>
                    <div class="theme-options">
                        <div class="theme-option" data-theme="light">
                            <div class="theme-preview light-theme"></div>
                            <span>Светлая</span>
                        </div>
                        <div class="theme-option" data-theme="dark">
                            <div class="theme-preview dark-theme"></div>
                            <span>Тёмная</span>
                        </div>
                    </div>
                </div>
            </section>
            
            <section class="app-settings">
                <h2>Настройки приложения</h2>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <span>Звуки</span>
                        <p class="setting-description">Включить звуки при выполнении задач</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="sounds-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <span>Сбросить все данные</span>
                        <p class="setting-description">Сбросить все данные приложения (задания, статистику, дневник, серию дней)</p>
                    </div>
                    <button id="reset-all-button" class="danger-button">Сбросить</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="../../index.html">
                <i class="fas fa-calendar-day"></i>
                <span>Daily</span>
            </a>
            <a href="../Weekly/Weekly.html">
                <i class="fas fa-calendar-week"></i>
                <span>Weekly</span>
            </a>
            <a href="../Stats/Stats.html">
                <i class="fas fa-chart-bar"></i>
                <span>Stats</span>
            </a>
            <a href="../Diary/Diary.html">
                <i class="fas fa-book"></i>
                <span>Diary</span>
            </a>
            <a href="./Settings.html" class="active">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="./Settings.js"></script>
</body>
</html>

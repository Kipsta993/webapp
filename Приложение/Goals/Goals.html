<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Goals.css">
    <link rel="stylesheet" href="../Прочее/underground-tab.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Goals</h1>
            <div class="stats">
                <div class="streak">
                    <img src="../Прочее/Огонь.png" alt="Серия дней">
                    <span id="streak-count">7</span>
                </div>
            </div>
        </header>

        <main>
            <section class="goals-section">
                <div class="section-header">
                    <h2>Долгосрочные цели</h2>
                    <div class="add-goal">
                        <i class="fas fa-plus"></i>
                    </div>
                </div>
                <div class="goals-list">
                    <!-- Здесь будут отображаться долгосрочные цели -->
                    <div class="goal-item">
                        <div class="goal-info">
                            <h3>Выучить JavaScript</h3>
                            <div class="goal-date">До 31 декабря 2023</div>
                            <div class="goal-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 65%;"></div>
                                </div>
                                <div class="progress-text">65%</div>
                            </div>
                        </div>
                        <div class="goal-actions">
                            <i class="fas fa-ellipsis-v"></i>
                        </div>
                    </div>
                    <div class="goal-item">
                        <div class="goal-info">
                            <h3>Прочитать 20 книг</h3>
                            <div class="goal-date">До 31 декабря 2023</div>
                            <div class="goal-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 40%;"></div>
                                </div>
                                <div class="progress-text">40%</div>
                            </div>
                        </div>
                        <div class="goal-actions">
                            <i class="fas fa-ellipsis-v"></i>
                        </div>
                    </div>
                </div>
            </section>

            <section class="goals-section">
                <div class="section-header">
                    <h2>Квартальные цели</h2>
                    <div class="add-goal">
                        <i class="fas fa-plus"></i>
                    </div>
                </div>
                <div class="goals-list">
                    <!-- Здесь будут отображаться квартальные цели -->
                    <div class="goal-item">
                        <div class="goal-info">
                            <h3>Завершить курс по React</h3>
                            <div class="goal-date">До 30 сентября 2023</div>
                            <div class="goal-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 80%;"></div>
                                </div>
                                <div class="progress-text">80%</div>
                            </div>
                        </div>
                        <div class="goal-actions">
                            <i class="fas fa-ellipsis-v"></i>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="../../index.html">
                <i class="fas fa-calendar-day"></i>
                <span>Daily</span>
            </a>
            <a href="../Weekly/Weekly.html">
                <i class="fas fa-calendar-week"></i>
                <span>Weekly</span>
            </a>
            <a href="Goals.html" class="active">
                <i class="fas fa-bullseye"></i>
                <span>Goals</span>
            </a>
            <a href="../Stats/Stats.html">
                <i class="fas fa-chart-bar"></i>
                <span>Stats</span>
            </a>
            <a href="../Diary/Diary.html">
                <i class="fas fa-book"></i>
                <span>Diary</span>
            </a>
        </nav>
    </div>

    <!-- Модальное окно для добавления/редактирования цели -->
    <div class="modal" id="goal-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить цель</h2>
                <div class="close-button">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="modal-body">
                <form id="goal-form">
                    <div class="form-group">
                        <label for="goal-title">Название цели</label>
                        <input type="text" id="goal-title" required>
                    </div>
                    <div class="form-group">
                        <label for="goal-date">Дата завершения</label>
                        <input type="date" id="goal-date" required>
                    </div>
                    <div class="form-group">
                        <label for="goal-type">Тип цели</label>
                        <select id="goal-type">
                            <option value="long-term">Долгосрочная</option>
                            <option value="quarterly">Квартальная</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="goal-progress">Прогресс (%)</label>
                        <input type="range" id="goal-progress" min="0" max="100" value="0">
                        <span id="progress-value">0%</span>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="submit-button">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="Goals.js"></script>
    <script src="../Прочее/underground-tab.js"></script>
</body>
</html>
